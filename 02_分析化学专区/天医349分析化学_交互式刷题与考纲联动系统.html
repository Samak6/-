<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天医349分析化学 · 交互式刷题与考纲联动系统</title>
<!-- KaTeX for offline-ready fast math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInPage()"></script>
<style>
  :root {
    --bg: #090d16;
    --panel: #131c2e;
    --panel-hover: #1b273f;
    --border: #23334f;
    --text: #e2e8f0;
    --muted: #8da2c0;
    --primary: #38bdf8;
    --primary-dark: #0284c7;
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.16);
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.16);
    --warn: #f59e0b;
    --warn-bg: rgba(245, 158, 11, 0.16);
    --purple: #a855f7;
    --purple-bg: rgba(168, 85, 247, 0.16);
    --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 14px;
    padding-bottom: 80px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(9, 13, 22, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  .top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    font-size: 22px;
  }
  .brand h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
    color: var(--primary);
  }
  .brand-badge {
    font-size: 11px;
    padding: 2px 7px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    border-radius: 999px;
    border: 1px solid rgba(56, 189, 248, 0.3);
  }
  .quick-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  button, select, input[type="text"] {
    font-family: inherit;
    font-size: 12.5px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    outline: none;
    transition: all 0.15s ease;
  }
  button {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 500;
  }
  button:hover {
    background: var(--panel-hover);
    border-color: var(--primary);
  }
  button.active {
    background: var(--primary-dark);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
  }
  button.btn-warn {
    background: var(--warn-bg);
    border-color: var(--warn);
    color: #fbbf24;
  }
  button.btn-danger {
    background: var(--danger-bg);
    border-color: var(--danger);
    color: #f87171;
  }
  button.btn-purple {
    background: var(--purple-bg);
    border-color: var(--purple);
    color: #c084fc;
  }
  .unit-nav {
    max-width: 1200px;
    margin: 10px auto 0;
    padding-top: 8px;
    border-top: 1px dashed rgba(35, 51, 79, 0.7);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .unit-btn {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    background: rgba(19, 28, 46, 0.8);
  }
  .unit-btn.active {
    background: var(--primary-dark);
    border-color: var(--primary);
    color: #fff;
  }
  .unit-count {
    background: rgba(0, 0, 0, 0.3);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 10.5px;
    margin-left: 3px;
  }
  .container {
    max-width: 1200px;
    margin: 14px auto;
    padding: 0 16px;
  }
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .stat-item strong {
    color: var(--primary);
    font-size: 15px;
    margin: 0 3px;
  }
  .search-box {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 220px;
    max-width: 380px;
  }
  .search-input {
    width: 100%;
    padding: 6px 12px;
    background: rgba(9, 13, 22, 0.6);
  }
  .q-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: var(--card-shadow);
    transition: border-color 0.15s ease;
  }
  .q-card:hover {
    border-color: rgba(56, 189, 248, 0.4);
  }
  .q-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .q-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .q-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .badge-unit { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }
  .badge-tag { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
  .badge-multi { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
  .q-actions {
    display: flex;
    gap: 6px;
  }
  .btn-icon {
    background: transparent;
    border: 1px solid transparent;
    padding: 4px 7px;
    color: var(--muted);
    font-size: 13px;
    border-radius: 4px;
  }
  .btn-icon:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }
  .btn-icon.starred {
    color: #fbbf24;
  }
  .q-stem {
    font-size: 15px;
    font-weight: 600;
    color: #f8fafc;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opt-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(9, 13, 22, 0.45);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .opt-item:hover {
    background: var(--panel-hover);
    border-color: rgba(56, 189, 248, 0.5);
    transform: translateX(2px);
  }
  .opt-indicator {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #475569;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11.5px;
    font-weight: 800;
    flex-shrink: 0;
    transition: all 0.15s ease;
    background: rgba(15, 23, 42, 0.6);
    color: transparent;
  }
  .opt-indicator.indicator-square {
    border-radius: 5px;
  }
  .opt-item:hover .opt-indicator {
    border-color: var(--primary);
  }
  .opt-key {
    font-weight: 700;
    font-size: 14px;
    min-width: 20px;
    color: var(--primary);
  }
  .opt-text {
    flex: 1;
    color: #e2e8f0;
    font-size: 13.5px;
    line-height: 1.55;
  }
  /* Statuses */
  .opt-item.selected-picked {
    background: rgba(56, 189, 248, 0.12) !important;
    border-color: var(--primary) !important;
  }
  .opt-item.selected-picked .opt-indicator {
    border-color: var(--primary);
    background: var(--primary);
    color: #090d16;
  }
  .opt-item.selected-correct {
    background: var(--success-bg) !important;
    border-color: var(--success) !important;
    color: #ecfdf5;
  }
  .opt-item.selected-correct .opt-indicator {
    border-color: var(--success);
    background: var(--success);
    color: #fff;
  }
  .opt-item.selected-wrong {
    background: var(--danger-bg) !important;
    border-color: var(--danger) !important;
    color: #fef2f2;
  }
  .opt-item.selected-wrong .opt-indicator {
    border-color: var(--danger);
    background: var(--danger);
    color: #fff;
  }
  .opt-item.answer-highlight {
    border-color: var(--success) !important;
    background: rgba(16, 185, 129, 0.1);
  }
  .opt-item.answer-highlight .opt-indicator {
    border-color: var(--success);
    color: var(--success);
  }
  .blind-hidden .options-list {
    display: none;
  }
  .blind-placeholder {
    display: none;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .blind-placeholder:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(56, 189, 248, 0.08);
  }
  .blind-hidden .blind-placeholder {
    display: block;
  }
  .q-explanation {
    margin-top: 14px;
    padding: 12px 16px;
    background: rgba(2, 132, 199, 0.08);
    border-left: 4px solid var(--primary);
    border-radius: 0 6px 6px 0;
    font-size: 13.5px;
    color: #e2e8f0;
    display: none;
  }
  .q-explanation.visible {
    display: block;
  }
  .exp-answer {
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 6px;
  }
  .batch-copy-bar {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(168, 85, 247, 0.08);
    border: 1px dashed rgba(168, 85, 247, 0.35);
    border-radius: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0284c7;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    z-index: 1000;
    font-size: 13px;
    display: none;
  }
  /* Collapsible / Hideable UI components */
  header.header-hidden {
    display: none !important;
  }
  .unit-nav.nav-hidden {
    display: none !important;
  }
  .stats-bar.stats-hidden {
    display: none !important;
  }
  .batch-copy-bar.batch-hidden {
    display: none !important;
  }

  /* Floating Control FAB Group (bottom-right) */
  .mini-fab-group {
    position: fixed;
    right: 18px;
    bottom: 22px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }
  .mini-fab {
    background: rgba(19, 28, 46, 0.92);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    transition: all 0.15s ease;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .mini-fab:hover {
    background: var(--panel-hover);
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .mini-fab.fab-restore {
    background: rgba(2, 132, 199, 0.95);
    border-color: var(--primary);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    animation: fabPulse 2s infinite ease-in-out;
  }
  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
    50% { box-shadow: 0 0 22px rgba(56, 189, 248, 0.85); }
  }

  /* Modal Mask & Settings Card */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1200;
    padding: 16px;
    backdrop-filter: blur(6px);
  }
  .modal-mask.open {
    display: flex;
  }
  .modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 580px;
    width: 100%;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 {
    margin: 0;
    font-size: 16px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-close-btn {
    background: transparent;
    border: none;
    font-size: 22px;
    color: var(--muted);
    cursor: pointer;
    padding: 0 6px;
    line-height: 1;
  }
  .modal-close-btn:hover {
    color: var(--text);
  }
  .preset-btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .vis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .vis-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(9, 13, 22, 0.55);
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    transition: all 0.12s ease;
  }
  .vis-item:hover {
    background: var(--panel-hover);
    border-color: rgba(56, 189, 248, 0.4);
  }
  .vis-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="top-row">
    <div class="brand">
      <span class="brand-logo">🧪</span>
      <div>
        <h1>天医349分析化学 · 交互式刷题与考纲联动系统</h1>
      </div>
      <span class="brand-badge">题解合一精校版</span>
    </div>
    <div class="quick-controls">
      <button id="modePractice" class="active" onclick="switchMode('practice')">✍️ 自测做题模式</button>
      <button id="modeRecite" onclick="switchMode('recite')">📖 沉浸背题模式</button>
      <button id="toggleBlind" onclick="toggleBlindMode()">🙈 盲刷隐藏选项</button>
      <button class="btn-purple" onclick="toggleMistakeView()">📕 错题本 (<span id="mistakeBadge">0</span>)</button>
      <button id="btnFoldNav" onclick="toggleNavVisibility()" title="折叠/展开单元考点导航栏">🔼 折叠导航</button>
      <button id="btnToggleHeader" class="btn-warn" onclick="toggleHeaderVisibility()" title="隐藏吸顶主栏，获得最大刷题视野">👁️ 隐藏顶栏</button>
      <button onclick="openVisibilityModal()" title="设置界面各组件显示与隐藏">⚙️ 界面显示</button>
    </div>
  </div>

  <div class="unit-nav" id="unitNav">
    <button class="unit-btn active" onclick="selectUnit('ALL')">🌟 全部考点 <span class="unit-count" id="allCount">179</span></button>
  </div>
</header>

<div class="container">
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <span>已完成: <strong id="statAnswered">0</strong> / <span id="statTotal">179</span></span>
      <span style="margin-left: 14px;">正确率: <strong id="statAccuracy">0%</strong></span>
      <span style="margin-left: 14px;">错题归档: <strong id="statMistakes" style="color:#ef4444;">0</strong></span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索考点 / 试剂 / 公式 / 题号..." oninput="handleSearch()">
      <button class="btn-warn" onclick="clearMistakes()">重置做题记录</button>
    </div>
  </div>

  <div class="batch-copy-bar" id="batchCopyBar">
    <span style="color:#c084fc; font-weight:600;">🤖 AI 伴学无漏题复制：</span>
    <span>将当前筛选试题一键复制为无多余空行的严密 Prompt，防大模型吞题漏题：</span>
    <button class="btn-purple" onclick="copyBatchPrompt(10)">复制前 10 题</button>
    <button class="btn-purple" onclick="copyBatchPrompt(20)">复制前 20 题</button>
    <button class="btn-purple" onclick="copyBatchPrompt(999)">复制当前全部题目</button>
  </div>

  <div id="questionsContainer" style="margin-top: 16px;"></div>
</div>

<!-- 悬浮快捷控制与恢复栏 -->
<div class="mini-fab-group" id="miniFabGroup">
  <button class="mini-fab fab-restore" id="fabRestoreHeader" onclick="toggleHeaderVisibility()" style="display:none;" title="恢复显示吸顶顶栏">👁️ 展开顶栏</button>
  <button class="mini-fab" id="fabToggleNav" onclick="toggleNavVisibility()" title="快速折叠/展开单元导航条">🗺️ 单元导航</button>
  <button class="mini-fab" onclick="toggleImmersivePreset()" title="一键切换极简沉浸做题模式">📱 沉浸模式</button>
  <button class="mini-fab" onclick="openVisibilityModal()" title="打开界面显示定制面板">⚙️ 显示设置</button>
  <button class="mini-fab" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="快速返回页面顶部">⬆️ 顶部</button>
</div>

<!-- 界面元素显隐与沉浸模式设置弹窗 -->
<div class="modal-mask" id="visibilityModal" onclick="closeVisibilityModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>⚙️ 界面显示与沉浸做题设置</h3>
      <button class="modal-close-btn" onclick="closeVisibilityModal()">&times;</button>
    </div>
    
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">
      一键预设方案：
    </div>
    <div class="preset-btn-group">
      <button class="btn-primary" onclick="applyUIPreset('immersive')">📱 极简沉浸 (隐藏全部控制条)</button>
      <button class="btn-purple" onclick="applyUIPreset('compact')">⚡ 紧凑模式 (隐藏导航与伴学条)</button>
      <button onclick="applyUIPreset('all')">🌟 完整显示 (所有面板)</button>
    </div>

    <div style="font-size:12.5px; color:var(--muted); margin-bottom:8px;">
      自定义模块显隐开关：
    </div>
    <div class="vis-grid">
      <label class="vis-item">
        <span>📌 吸顶主控栏 (标题/模式切换)</span>
        <input type="checkbox" id="chk-vis-header" onchange="onVisCheckboxChange()">
      </label>
      <label class="vis-item">
        <span>🗺️ 单元考点导航栏 (8个单元切换)</span>
        <input type="checkbox" id="chk-vis-unitnav" onchange="onVisCheckboxChange()">
      </label>
      <label class="vis-item">
        <span>📊 做题统计与搜索条</span>
        <input type="checkbox" id="chk-vis-stats" onchange="onVisCheckboxChange()">
      </label>
      <label class="vis-item">
        <span>🤖 AI 伴学无漏题复制条</span>
        <input type="checkbox" id="chk-vis-batchcopy" onchange="onVisCheckboxChange()">
      </label>
      <label class="vis-item">
        <span>🙈 盲刷隐藏选项 (仅留题干自测)</span>
        <input type="checkbox" id="chk-vis-blind" onchange="onVisCheckboxChange()">
      </label>
    </div>

    <div style="font-size:12px; color:var(--muted); margin-top:14px; line-height:1.6; border-top:1px dashed var(--border); padding-top:10px;">
      💡 <strong>防遮挡与随时恢复：</strong><br>
      • 隐藏吸顶主栏后，页面右下角将常驻浮动药丸按钮 <code>👁️ 展开顶栏</code>，随时点击一键恢复。<br>
      • 快捷键支持：按键盘 <strong>Esc</strong> 键可快速关闭本面板或切换顶栏显隐。
    </div>

let currentMode = 'practice'; // 'practice' or 'recite'
let isBlind = false;
let currentUnitId = 'ALL';
let showMistakesOnly = false;
let userAnswers = {}; // questionId -> selectedKey (e.g. 'A' or 'AC')
let mistakeSet = new Set();
let starredSet = new Set();
let submittedMultiSet = new Set();
let unfoldedBlindCards = new Set();

const DEFAULT_UI_VIS = {
  headerBar: true,
  unitNav: true,
  statsBar: true,
  batchCopyBar: true
};
let uiVisibility = Object.assign({}, DEFAULT_UI_VIS);

// Load storage
try {
  const savedAns = localStorage.getItem('chem_quiz_answers');
  if (savedAns) userAnswers = JSON.parse(savedAns);
  const savedMistakes = localStorage.getItem('chem_quiz_mistakes');
  if (savedMistakes) mistakeSet = new Set(JSON.parse(savedMistakes));
  const savedStarred = localStorage.getItem('chem_quiz_starred');
  if (savedStarred) starredSet = new Set(JSON.parse(savedStarred));
  const savedMulti = localStorage.getItem('chem_quiz_submitted_multi');
  if (savedMulti) submittedMultiSet = new Set(JSON.parse(savedMulti));
  const savedVis = localStorage.getItem('chem_ui_visibility');
  if (savedVis) uiVisibility = Object.assign({}, DEFAULT_UI_VIS, JSON.parse(savedVis));
} catch (e) { console.error(e); }

function saveStorage() {
  try {
    localStorage.setItem('chem_quiz_answers', JSON.stringify(userAnswers));
    localStorage.setItem('chem_quiz_mistakes', JSON.stringify(Array.from(mistakeSet)));
    localStorage.setItem('chem_quiz_starred', JSON.stringify(Array.from(starredSet)));
    localStorage.setItem('chem_quiz_submitted_multi', JSON.stringify(Array.from(submittedMultiSet)));
    localStorage.setItem('chem_ui_visibility', JSON.stringify(uiVisibility));
  } catch(e) {}
}

// Initialize unit nav buttons
function initNav() {
  const nav = document.getElementById('unitNav');
  QUIZ_DATA.forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn';
    btn.id = 'unitBtn_' + u.id;
    btn.innerHTML = `${u.title.split('：')[0]} <span class="unit-count">${u.questions.length}</span>`;
    btn.onclick = () => selectUnit(u.id);
    nav.appendChild(btn);
  });
}

function selectUnit(uid) {
  currentUnitId = uid;
  showMistakesOnly = false;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
  if (uid === 'ALL') {
    document.querySelector('.unit-btn').classList.add('active');
  } else {
    const btn = document.getElementById('unitBtn_' + uid);
    if (btn) btn.classList.add('active');
  }
  renderQuestions();
}

function switchMode(m) {
  currentMode = m;
  document.getElementById('modePractice').classList.toggle('active', m === 'practice');
  document.getElementById('modeRecite').classList.toggle('active', m === 'recite');
  renderQuestions();
}

function toggleBlindMode() {
  isBlind = !isBlind;
  unfoldedBlindCards.clear();
  document.getElementById('toggleBlind').classList.toggle('active', isBlind);
  renderQuestions();
  showToast(isBlind ? "已开启盲刷隐藏选项（点击题目占位条可单题临时展开）" : "已退出盲刷模式，选项正常显示");
}

function toggleCardBlind(qKey) {
  if (unfoldedBlindCards.has(qKey)) {
    unfoldedBlindCards.delete(qKey);
  } else {
    unfoldedBlindCards.add(qKey);
  }
  renderQuestions();
}

function toggleMistakeView() {
  showMistakesOnly = !showMistakesOnly;
  if (showMistakesOnly) {
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
  }
  renderQuestions();
}

function getAllFlatQuestions() {
  const list = [];
  QUIZ_DATA.forEach(u => {
    u.questions.forEach(q => {
      list.push({ ...q, unitId: u.id, unitTitle: u.title });
    });
  });
  return list;
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  
  const searchKw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let list = getAllFlatQuestions();

  if (showMistakesOnly) {
    list = list.filter(q => mistakeSet.has(getQKey(q)));
  } else if (currentUnitId !== 'ALL') {
    list = list.filter(q => q.unitId === currentUnitId);
  }

  if (searchKw) {
    list = list.filter(q => {
      const stemMatch = q.stem.toLowerCase().includes(searchKw);
      const tagMatch = (q.tag || '').toLowerCase().includes(searchKw);
      const optMatch = q.options.some(o => o.text.toLowerCase().includes(searchKw));
      const expMatch = q.analysis.toLowerCase().includes(searchKw);
      const idMatch = `${q.unitId}-${q.num}`.toLowerCase().includes(searchKw);
      return stemMatch || tagMatch || optMatch || expMatch || idMatch;
    });
  }

  updateStats();

  if (list.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--muted);">
      <div style="font-size:36px; margin-bottom:12px;">🔍</div>
      <div>未找到符合筛选条件的试题</div>
    </div>`;
    return;
  }

  list.forEach(q => {
    const qKey = getQKey(q);
    const card = document.createElement('div');
    const isCardBlind = isBlind && !unfoldedBlindCards.has(qKey);
    card.className = `q-card ${isCardBlind ? 'blind-hidden' : ''}`;
    card.id = 'card_' + qKey;

    const userAns = userAnswers[qKey] || '';
    const isMulti = (q.type === 'multi' || q.answer.length > 1);
    const isSubmitted = isMulti ? submittedMultiSet.has(qKey) : Boolean(userAns);
    const isStarred = starredSet.has(qKey);

    const isRecite = (currentMode === 'recite');
    const showExp = isRecite || isSubmitted;

    let optionsHtml = '';
    q.options.forEach(opt => {
      let optClass = 'opt-item';
      let icon = '';
      const isPick = userAns.includes(opt.key);
      const isTarget = q.answer.includes(opt.key);

      if (isRecite) {
        if (isTarget) {
          optClass += ' selected-correct';
          icon = '✓';
        }
      } else if (isSubmitted) {
        if (isPick && isTarget) {
          optClass += ' selected-correct';
          icon = '✓';
        } else if (isPick && !isTarget) {
          optClass += ' selected-wrong';
          icon = '✗';
        } else if (!isPick && isTarget) {
          optClass += ' answer-highlight';
          icon = '✓';
        }
      } else if (isPick) {
        optClass += ' selected-picked';
        icon = '●';
      }

      optionsHtml += `
        <div class="${optClass}" onclick="handleSelectOption('${qKey}', '${opt.key}')">
          <div class="opt-indicator ${isMulti ? 'indicator-square' : ''}">${icon}</div>
          <span class="opt-key">${opt.key}.</span>
          <span class="opt-text">${opt.text}</span>
        </div>
      `;
    });

    let actionBtnHtml = '';
    if (isMulti && !isRecite && !isSubmitted) {
      actionBtnHtml = `
        <div style="margin-top: 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
          <button class="btn-primary" onclick="submitMultiAnswer('${qKey}')">✅ 提交本题多选作答</button>
          <span style="font-size:12px; color:var(--muted);">已选: <strong style="color:var(--primary); font-size:14px;">${userAns || '尚未勾选'}</strong></span>
        </div>
      `;
    } else if (isSubmitted && !isRecite) {
      const isCorrect = (userAns === q.answer);
      actionBtnHtml = `
        <div style="margin-top: 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
          <button class="btn-warn" style="padding:4px 10px; font-size:12px;" onclick="retryQuestion('${qKey}')">🔄 重做本题</button>
          <span style="font-size:12.5px;">您的作答: <strong style="color:${isCorrect ? '#4ade80' : '#f87171'}">${userAns}</strong> ${isCorrect ? '✅ 回答正确' : '❌ 回答错误'}</span>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="q-header">
        <div class="q-meta">
          <span class="q-badge badge-unit">${q.unitId}-${String(q.num).padStart(2, '0')}</span>
          ${q.tag ? `<span class="q-badge badge-tag">${q.tag}</span>` : ''}
          ${isMulti ? `<span class="q-badge badge-multi">多选题</span>` : ''}
        </div>
        <div class="q-actions">
          <button class="btn-icon ${isStarred ? 'starred' : ''}" onclick="toggleStar('${qKey}')">★ 收藏</button>
          <button class="btn-icon" onclick="copySingleQuestion('${qKey}')">📋 复制</button>
        </div>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="blind-placeholder" onclick="toggleCardBlind('${qKey}')">🙈 盲刷模式进行中，选项已隐藏以训练纯粹记忆提取（👉 点击此处展开选项做题）</div>
      <div class="options-list">${optionsHtml}</div>
      ${actionBtnHtml}
      <div class="q-explanation ${showExp ? 'visible' : ''}" id="exp_${qKey}">
        <div class="exp-answer">【正确答案】${q.answer}</div>
        <div><strong>【考点解析】</strong>${q.analysis}</div>
      </div>
    `;

    container.appendChild(card);
  });

  // Trigger KaTeX rendering
  renderMathInPage();
}

function getQKey(q) {
  return `${q.unitId}_${q.num}`;
}

function handleSelectOption(qKey, optKey) {
  if (currentMode === 'recite') return;
  const q = findQuestion(qKey);
  if (!q) return;

  const isMulti = (q.type === 'multi' || q.answer.length > 1);

  if (isMulti) {
    if (submittedMultiSet.has(qKey)) return;
    let cur = userAnswers[qKey] || '';
    if (cur.includes(optKey)) {
      cur = cur.replace(optKey, '');
    } else {
      cur += optKey;
    }
    cur = cur.split('').sort().join('');
    userAnswers[qKey] = cur;
    saveStorage();
    renderQuestions();
  } else {
    userAnswers[qKey] = optKey;
    const isCorrect = (q.answer === optKey);
    if (!isCorrect) {
      mistakeSet.add(qKey);
    } else {
      // If correct
    }
    saveStorage();
    renderQuestions();
  }
}

function submitMultiAnswer(qKey) {
  const q = findQuestion(qKey);
  if (!q) return;
  const userAns = userAnswers[qKey] || '';
  if (!userAns) {
    showToast("请先选择选项后再提交");
    return;
  }
  submittedMultiSet.add(qKey);
  const isCorrect = (userAns === q.answer);
  if (!isCorrect) {
    mistakeSet.add(qKey);
  }
  saveStorage();
  renderQuestions();
  showToast(isCorrect ? "回答正确！" : "回答有误，已归入错题本");
}

function retryQuestion(qKey) {
  delete userAnswers[qKey];
  submittedMultiSet.delete(qKey);
  saveStorage();
  renderQuestions();
}

function findQuestion(qKey) {
  const [uid, numStr] = qKey.split('_');
  const num = parseInt(numStr, 10);
  const u = QUIZ_DATA.find(unit => unit.id === uid);
  if (!u) return null;
  return u.questions.find(q => q.num === num);
}

function toggleStar(qKey) {
  if (starredSet.has(qKey)) starredSet.delete(qKey);
  else starredSet.add(qKey);
  saveStorage();
  renderQuestions();
}

function clearMistakes() {
  if (confirm("确定要清空全部做题记录与错题本吗？")) {
    userAnswers = {};
    mistakeSet.clear();
    submittedMultiSet.clear();
    saveStorage();
    renderQuestions();
    showToast("做题记录与错题本已重置");
  }
}

function updateStats() {
  const allQs = getAllFlatQuestions();
  const total = allQs.length;
  document.getElementById('allCount').textContent = total;
  document.getElementById('statTotal').textContent = total;

  let answeredCount = 0;
  let correctCount = 0;

  allQs.forEach(q => {
    const key = getQKey(q);
    const userAns = userAnswers[key];
    const isMulti = (q.type === 'multi' || q.answer.length > 1);
    if (userAns && (!isMulti || submittedMultiSet.has(key))) {
      answeredCount++;
      if (q.answer === userAns) {
        correctCount++;
      }
    }
  });

  document.getElementById('statAnswered').textContent = answeredCount;
  document.getElementById('mistakeBadge').textContent = mistakeSet.size;
  document.getElementById('statMistakes').textContent = mistakeSet.size;

  const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
  document.getElementById('statAccuracy').textContent = rate + '%';
}

function handleSearch() {
  renderQuestions();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function copySingleQuestion(qKey) {
  const q = findQuestion(qKey);
  if (!q) return;
  let text = `【${q.unitId}-${q.num}】${q.stem}\n`;
  q.options.forEach(o => { text += `${o.key}. ${o.text}\n`; });
  text += `【答案】${q.answer}\n【解析】${q.analysis}`;
  navigator.clipboard.writeText(text).then(() => {
    showToast("题目已复制到剪贴板");
  });
}

function copyBatchPrompt(limit) {
  const searchKw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let list = getAllFlatQuestions();
  if (showMistakesOnly) {
    list = list.filter(q => mistakeSet.has(getQKey(q)));
  } else if (currentUnitId !== 'ALL') {
    list = list.filter(q => q.unitId === currentUnitId);
  }
  if (searchKw) {
    list = list.filter(q => q.stem.toLowerCase().includes(searchKw) || q.analysis.toLowerCase().includes(searchKw));
  }

  const targetList = list.slice(0, limit);
  if (targetList.length === 0) {
    showToast("当前没有可选题目");
    return;
  }

  let prompt = `请作为天医349分析化学权威教研专家，深度解答并剖析以下 ${targetList.length} 道核心选择题。严格要求：请逐一给出答案、秒杀技巧、陷阱分析与考纲知识点展开，切勿遗漏任何一道试题：\n\n`;

  targetList.forEach((q, idx) => {
    prompt += `--- 第 ${idx+1} 题 (${q.unitId}-${q.num}) ---\n`;
    prompt += `${q.stem}\n`;
    q.options.forEach(o => {
      prompt += `${o.key}. ${o.text}\n`;
    });
    prompt += `\n`;
  });

  navigator.clipboard.writeText(prompt).then(() => {
    showToast(`已成功复制 ${targetList.length} 道题目 Prompt！`);
  });
}

function renderMathInPage() {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

function applyUIVisibility() {
  const v = uiVisibility;
  const headerEl = document.getElementById('siteHeader');
  const navEl = document.getElementById('unitNav');
  const statsEl = document.getElementById('statsBar');
  const batchEl = document.getElementById('batchCopyBar');
  const fabRestore = document.getElementById('fabRestoreHeader');
  const btnFoldNav = document.getElementById('btnFoldNav');
  const btnToggleHeader = document.getElementById('btnToggleHeader');

  if (headerEl) {
    headerEl.classList.toggle('header-hidden', !v.headerBar);
  }
  if (navEl) {
    navEl.classList.toggle('nav-hidden', !v.unitNav);
  }
  if (statsEl) {
    statsEl.classList.toggle('stats-hidden', !v.statsBar);
  }
  if (batchEl) {
    batchEl.classList.toggle('batch-hidden', !v.batchCopyBar);
  }

  if (fabRestore) {
    fabRestore.style.display = v.headerBar ? 'none' : 'inline-flex';
  }
  if (btnFoldNav) {
    btnFoldNav.innerHTML = v.unitNav ? '🔼 折叠导航' : '🔽 展开导航';
  }
  if (btnToggleHeader) {
    btnToggleHeader.innerHTML = v.headerBar ? '👁️ 隐藏顶栏' : '👁️ 展开顶栏';
  }

  syncModalCheckboxes();
}

function toggleHeaderVisibility() {
  uiVisibility.headerBar = !uiVisibility.headerBar;
  saveStorage();
  applyUIVisibility();
  showToast(uiVisibility.headerBar ? "顶栏已展开" : "顶栏已隐藏（右下角按钮随时恢复）");
}

function toggleNavVisibility() {
  uiVisibility.unitNav = !uiVisibility.unitNav;
  saveStorage();
  applyUIVisibility();
  showToast(uiVisibility.unitNav ? "单元考点导航已展开" : "单元考点导航已折叠");
}

function toggleImmersivePreset() {
  const isImmersive = !uiVisibility.headerBar && !uiVisibility.unitNav && !uiVisibility.statsBar && !uiVisibility.batchCopyBar;
  if (isImmersive) {
    applyUIPreset('all');
    showToast("已退出沉浸模式，恢复完整界面");
  } else {
    applyUIPreset('immersive');
    showToast("已开启极简沉浸做题模式");
  }
}

function applyUIPreset(preset) {
  if (preset === 'immersive') {
    uiVisibility.headerBar = false;
    uiVisibility.unitNav = false;
    uiVisibility.statsBar = false;
    uiVisibility.batchCopyBar = false;
  } else if (preset === 'compact') {
    uiVisibility.headerBar = true;
    uiVisibility.unitNav = false;
    uiVisibility.statsBar = true;
    uiVisibility.batchCopyBar = false;
  } else {
    uiVisibility.headerBar = true;
    uiVisibility.unitNav = true;
    uiVisibility.statsBar = true;
    uiVisibility.batchCopyBar = true;
  }
  saveStorage();
  applyUIVisibility();
}

function openVisibilityModal() {
  syncModalCheckboxes();
  document.getElementById('visibilityModal').classList.add('open');
}

function closeVisibilityModal(e) {
  if (e && e.target && e.target !== e.currentTarget && !e.target.classList.contains('modal-close-btn')) return;
  document.getElementById('visibilityModal').classList.remove('open');
}

function syncModalCheckboxes() {
  const chkHeader = document.getElementById('chk-vis-header');
  const chkNav = document.getElementById('chk-vis-unitnav');
  const chkStats = document.getElementById('chk-vis-stats');
  const chkBatch = document.getElementById('chk-vis-batchcopy');
  const chkBlind = document.getElementById('chk-vis-blind');

  if (chkHeader) chkHeader.checked = !!uiVisibility.headerBar;
  if (chkNav) chkNav.checked = !!uiVisibility.unitNav;
  if (chkStats) chkStats.checked = !!uiVisibility.statsBar;
  if (chkBatch) chkBatch.checked = !!uiVisibility.batchCopyBar;
  if (chkBlind) chkBlind.checked = !!isBlind;
}

function onVisCheckboxChange() {
  uiVisibility.headerBar = document.getElementById('chk-vis-header').checked;
  uiVisibility.unitNav = document.getElementById('chk-vis-unitnav').checked;
  uiVisibility.statsBar = document.getElementById('chk-vis-stats').checked;
  uiVisibility.batchCopyBar = document.getElementById('chk-vis-batchcopy').checked;
  
  const blindVal = document.getElementById('chk-vis-blind').checked;
  if (blindVal !== isBlind) {
    toggleBlindMode();
  }

  saveStorage();
  applyUIVisibility();
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const modal = document.getElementById('visibilityModal');
    if (modal && modal.classList.contains('open')) {
      modal.classList.remove('open');
    } else {
      toggleHeaderVisibility();
    }
  }
});

// Startup
initNav();
applyUIVisibility();
renderQuestions();
</script>
